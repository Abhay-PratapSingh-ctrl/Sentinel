# ─────────────────────────────────────────────────────────────
#  Sentinel Bot — Configuration
#  Copy this to application.properties and fill in your values.
#  NEVER commit real private keys to git — use env vars in prod.
# ─────────────────────────────────────────────────────────────

# ── Polkadot Hub EVM Node ─────────────────────────────────────
# Testnet RPC endpoint
sentinel.rpc-url=https://services.polkadothub-rpc.com/testnet

# Chain ID for Polkadot Hub Testnet
sentinel.chain-id=420420417

# ── Contract Addresses (fill in after deploying) ──────────────
sentinel.vault-address=0x644c0deb81e8c40abfae2c549e94ac770a938e81
sentinel.susd-address=0xe7e85d0e7d22cc53322e492b1c5d97e2132de731
sentinel.usdt-token-address=0xAfBDeD88916ea0DC2F4882968Cc6C3E3202402c5
# ── Guardian Wallet (Sentinel Bot's signing key) ──────────────
# This is the wallet set as `guardian` in SentinelVault.sol
# Use env var in production: export SENTINEL_PRIVATE_KEY=0x...
sentinel.guardian-private-key=${SENTINEL_PRIVATE_KEY:0xYOUR_PRIVATE_KEY_HERE}

# ── Pyth Oracle ───────────────────────────────────────────────
# REST endpoint for DOT/USD price feed
sentinel.pyth-api-url=https://hermes.pyth.network/v2/updates/price/latest
# DOT/USD price feed ID on Pyth
sentinel.dot-price-feed-id=0xca80ba6dc32e08d06f1aa886011eed1d77c77be9eb761cc10d72b7d0a2fd57a6

# ── Health Factor Thresholds ──────────────────────────────────
# All values in percentage (e.g. 130 = 130%)
sentinel.hf-warning-threshold=130      # Send Telegram warning at this level
sentinel.hf-pause-threshold=125        # Pause the position at this level
sentinel.hf-rebalance-threshold=120    # Trigger emergency rebalance here
sentinel.hf-safe-threshold=150         # Considered safe above this

# ── Monitoring Schedule ───────────────────────────────────────
# How often to poll all positions (milliseconds)
# 60000 = every 60 seconds
sentinel.monitor-interval-ms=60000

# ── Strategy Mode ─────────────────────────────────────────────
# CONSERVATIVE (rebalances at 1.5) or AGGRESSIVE (rebalances at 1.15)
sentinel.strategy-mode=CONSERVATIVE

# ── Aegis Dynamic Buffer ────────────────────────────────────────────
# DOT price standard-deviation (USD) that triggers the elevated safety target.
# e.g. 0.30 = if 60-min price std-dev exceeds $0.30, Aegis buffer activates.
sentinel.aegis-volatility-threshold=0.30
# Elevated Health Factor % target used during red-flag market conditions.
# Replaces the normal hf-safe-threshold (150%) during volatile periods.
sentinel.aegis-elevated-buffer=170

# ── LLM Risk Reports (/why command) ─────────────────────────────
# Optional: Set your OpenAI key to enable GPT-4o-mini powered /why reports.
# Leave blank to use the built-in template-based fallback (no API needed).
sentinel.open-ai-api-key=${OPENAI_API_KEY:}
sentinel.open-ai-model=gpt-4o-mini

sentinel.usdt-token-address=0xAfBDeD88916ea0DC2F4882968Cc6C3E3202402c5

# ── PVM Precompile (Trustless Rebalancing Brain) ─────────────────────────
# Address of the deployed PVM precompile on Polkadot Hub.
# Leave empty (or set to 0x0000...0000) to disable PVM verification — the vault
# will still rebalance but without on-chain Rust verification (graceful fallback).
# Set this once you have deployed pvm-risk-score via: cargo build --release
sentinel.pvm-precompile-address=

# ── Telegram Bot ─────────────────────────────────────────────────
# Get these from @BotFather on Telegram
sentinel.telegram-bot-token=${TELEGRAM_BOT_TOKEN:your_bot_token_here}
sentinel.telegram-bot-username=SentinelDeFiBot

# ── Gas Settings ──────────────────────────────────────────────
# Gas limit for guardian transactions (pausePosition, emergencyRebalance)
sentinel.gas-limit=500000
# Gas price in Gwei
sentinel.gas-price-gwei=20

# Spring settings
spring.application.name=sentinel-bot
logging.level.com.sentinel=INFO
logging.level.org.web3j=WARN