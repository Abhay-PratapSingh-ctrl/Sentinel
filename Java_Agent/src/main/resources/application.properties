# ─────────────────────────────────────────────────────────────
#  Sentinel Bot — Configuration
#  Fill in your values after contract deployment.
#  NEVER commit real private keys to git — use env vars in prod.
# ─────────────────────────────────────────────────────────────

# ── Polkadot Hub EVM Node ─────────────────────────────────────
sentinel.rpc-url=https://services.polkadothub-rpc.com/testnet
sentinel.chain-id=420420417

# ── Contract Addresses (fill in after deploying) ──────────────
sentinel.vault-address=0xYOUR_VAULT_ADDRESS_HERE
sentinel.susd-address=0xYOUR_SUSD_ADDRESS_HERE

# ── Guardian Wallet ───────────────────────────────────────────
# Use env var in production: export SENTINEL_PRIVATE_KEY=0x...
sentinel.guardian-private-key=${SENTINEL_PRIVATE_KEY:0xYOUR_PRIVATE_KEY_HERE}

# ── Pyth Oracle ───────────────────────────────────────────────
sentinel.pyth-api-url=https://hermes.pyth.network/v2/updates/price/latest
sentinel.dot-price-feed-id=0xca80ba6dc32e08d06f1aa886011eed1d77c77be9eb761cc10d72b7d0a2fd57a6

# ── Health Factor Thresholds (percentage) ─────────────────────
sentinel.hf-warning-threshold=130
sentinel.hf-pause-threshold=125
sentinel.hf-rebalance-threshold=120
sentinel.hf-safe-threshold=150

# ── Monitoring Schedule ───────────────────────────────────────
sentinel.monitor-interval-ms=60000

# ── Telegram Bot ──────────────────────────────────────────────
sentinel.telegram-bot-token=${TELEGRAM_BOT_TOKEN:your_bot_token_here}
sentinel.telegram-bot-username=SentinelDeFiBot

# ── Gas Settings ──────────────────────────────────────────────
sentinel.gas-limit=500000
sentinel.gas-price-gwei=20

# ── Spring ────────────────────────────────────────────────────
spring.application.name=sentinel-bot
logging.level.com.sentinel=INFO
logging.level.org.web3j=WARN
