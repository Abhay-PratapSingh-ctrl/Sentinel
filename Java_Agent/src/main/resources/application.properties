# ─────────────────────────────────────────────────────────────
#  Sentinel Bot — Configuration
#  Fill in your values after contract deployment.
#  NEVER commit real private keys to git — use env vars in prod.
# ─────────────────────────────────────────────────────────────

# ── Polkadot Hub EVM Node ─────────────────────────────────────
sentinel.rpc-url=https://services.polkadothub-rpc.com/testnet
sentinel.chain-id=420420417

# ── Contract Addresses (deployed 2026-03-08 on Polkadot Hub Testnet) ────────
sentinel.vault-address=0x644c0deb81e8c40abfae2c549e94ac770a938e81
sentinel.susd-address=0xe7e85d0e7d22cc53322e492b1c5d97e2132de731
# oracle: 0xdAeDe10E2aB19201485283aFdACbE2E296435aE6 (MockPriceOracle)

# ── Guardian Wallet ───────────────────────────────────────────
# Guardian address: 0xf896C48464Da9Bc3894Fbea073b60e50e813E7FC (Talisman)
# Set via env var: export SENTINEL_PRIVATE_KEY=0x...
sentinel.guardian-private-key=${SENTINEL_PRIVATE_KEY:0xYOUR_PRIVATE_KEY_HERE}

# ── Pyth Oracle ───────────────────────────────────────────────
sentinel.pyth-api-url=https://hermes.pyth.network/v2/updates/price/latest
sentinel.dot-price-feed-id=0xca3eed9b267293f6595901c734c7525ce8ef49adafe8284606ceb307afa2ca5b

# ── Health Factor Thresholds (percentage) ─────────────────────
sentinel.hf-warning-threshold=130
sentinel.hf-pause-threshold=125
sentinel.hf-rebalance-threshold=120
sentinel.hf-safe-threshold=150

# ── Strategy Mode ─────────────────────────────────────────────
# CONSERVATIVE (rebalances at 145%) or AGGRESSIVE (rebalances at 115%)
sentinel.strategy-mode=CONSERVATIVE

# ── Aegis Dynamic Buffer ─────────────────────────────────────
# DOT price std-dev (USD) that triggers elevated safety target.
# e.g. 0.30 = if 60-min price std-dev exceeds $0.30, Aegis buffer activates.
sentinel.aegis-volatility-threshold=0.30
# Elevated Health Factor % target during red-flag market conditions.
sentinel.aegis-elevated-buffer=170

# ── LLM Risk Reports (/why command) ──────────────────────────
# Optional: Set your OpenAI key to enable GPT-4o-mini /why reports.
# Leave blank to use the built-in template-based fallback.
sentinel.open-ai-api-key=${OPENAI_API_KEY:}
sentinel.open-ai-model=gpt-4o-mini
sentinel.anthropic-api-key=${ANTHROPIC_API_KEY:}
sentinel.gemini-api-key=${GEMINI_API_KEY:}
sentinel.groq-api-key=${Groq_API_KEY:}

# ── Multi-Collateral (Native USDT) ───────────────────────────
# ERC-20 precompile address for native USDT on Polkadot Hub.
# Asset Hub USDT assetId=1984 → 0xFFFFFFFF000007C0
sentinel.usdt-token-address=0xAfBDeD88916ea0DC2F4882968Cc6C3E3202402c5

# ── PVM Precompile (Trustless Rebalancing Brain) ──────────────
# Leave empty to skip PVM verification (graceful fallback).
# Set after deploying pvm-risk-score.
sentinel.pvm-precompile-address=

# ── Monitoring Schedule ───────────────────────────────────────
sentinel.monitor-interval-ms=30000

# ── Telegram Bot ──────────────────────────────────────────────
sentinel.telegram-bot-token=${TELEGRAM_BOT_TOKEN:8703897319:AAH2Sbe1lK8p2Dypg1dKXShJtPPaINQomGM}
sentinel.telegram-bot-username=SentinelDeFiBot

# ── Gas Settings ──────────────────────────────────────────────
sentinel.gas-limit=500000
sentinel.gas-price-gwei=20

# ── Spring ────────────────────────────────────────────────────
spring.application.name=sentinel-bot
server.port=8081
logging.level.com.sentinel=INFO
logging.level.org.web3j=WARN
